[pytest]
; QuantDesk pytest 配置（CF-13 测试骨架）
;
; 两条运行口径（Lead R6 速度治理）：
;   1) 默认快速套件（开发内循环，目标 ≤ 90s）：
;        .venv\Scripts\python.exe -m pytest tests -q
;      等价于 -m "not slow"：只跑 unit + 必要的 integration（排除 AppTest/子进程/大回测）
;   2) 全量套件（发版前，目标 ≤ 5min）：
;        .venv\Scripts\python.exe -m pytest tests -q -m "slow or not slow"
;
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -m "not slow"
markers =
    unit: 单元测试（纯函数/模型，无 IO）
    integration: 集成测试（涉及临时 SQLite、文件或模块协作）
    e2e: 端到端测试（多模块串起来跑通全流程，较慢）
    slow: 慢用例（AppTest 渲染、子进程脚本、大回测/大数据量），默认套件不跑
filterwarnings =
    default
